# Copy to config.local.yaml (gitignored) and edit. Nothing environment-specific lives in code.

# Entra tenant the audit must run against. The run aborts if the signed-in
# identity's token is for a different tenant.
tenant_id: "00000000-0000-0000-0000-000000000000"

scope:
  # RECOMMENDED: the tenant root management group (its id equals the tenant id)
  # so every subscription and management group is covered, including inherited
  # assignments. Descendant management groups are enumerated automatically.
  # Empty subscriptions AND empty management_groups = every subscription the
  # signed-in identity can read (misses management-group-only assignments).
  subscriptions: []
  management_groups: []   # e.g. ["<tenant-id>"]
  # Also report assignments inherited from management groups / root ("/").
  include_inherited: true
  # Query PIM schedules for every resource group too (finds eligible-only
  # assignments on RGs). Slower on large estates.
  scan_resource_groups: true

output_dir: evidence

# Control review cadence, recorded in the manifest for the audit trail.
review_frequency_days: 90

privileged_roles:
  privileged_admin:
    - Owner
    - Contributor
    - User Access Administrator
    - Role Based Access Control Administrator
    - Reservations Administrator
  sensitive_data_plane:
    - Key Vault Administrator
    - Key Vault Secrets Officer
    - Key Vault Crypto Officer
    - Key Vault Certificates Officer
    - Key Vault Data Access Administrator
    - Storage Blob Data Owner
    - Virtual Machine Administrator Login
    - Azure Event Hubs Data Owner
    - Azure Service Bus Data Owner

# A custom role is "custom_privileged" if any of its `actions` equals one of
# these or is a wildcard that covers one of these.
custom_role_privileged_actions:
  - "*"
  - "Microsoft.Authorization/*"
  - "Microsoft.Authorization/roleAssignments/write"
  - "Microsoft.Authorization/roleDefinitions/write"

# A custom role whose `dataActions` equal or are wildcards covering one of these
# is classed "sensitive_data_plane". Omit the key to use these defaults.
custom_role_sensitive_data_actions:
  - "*"
  - "Microsoft.KeyVault/vaults/secrets/*"
  - "Microsoft.KeyVault/vaults/keys/*"
  - "Microsoft.Storage/storageAccounts/blobServices/containers/blobs/*"

# Accepted exceptions. A matching row is moved out of exceptions_direct_user.csv,
# exceptions_privileged_permanent.csv and exceptions_entra_privileged_permanent.csv into
# exceptions_allowlisted.csv together with the reason, so the decision stays in the evidence.
# `role` (exact role name) and `scope` (exact scope, "/" for Entra tenant-wide) narrow the match; omit them to
# accept every exception for the principal. Entries that match nothing are reported as warnings.
exception_allowlist: []
#  - principal_id: "<object id>"
#    role: "User Access Administrator"
#    scope: "/providers/Microsoft.Management/managementGroups/<mg>"
#    reason: "MS-PIM service principal; Microsoft PIM requires User Access Administrator to manage assignments"

# Phase 2: privileged groups, PIM for Groups membership and access reviews (Microsoft Graph).
entra:
  enabled: true
  max_group_depth: 10     # nested-group expansion depth

# Sign-in. Default `cli` reuses your `az login` session (its Graph token lacks the PIM-for-Groups, directory-role
# eligibility and access-review permissions, so phase 2 reports coverage gaps). For full coverage use an app
# registration with a certificate (no secret in this file; keep the PEM, private key included, at mode 600):
#   Graph APPLICATION permissions (admin consent): Directory.Read.All, RoleManagement.Read.Directory,
#   PrivilegedAccess.Read.AzureADGroup, AccessReview.Read.All; Azure RBAC: Reader at the tenant root management group.
# auth:
#   mode: certificate                       # cli | certificate
#   client_id: "<application (client) id>"
#   certificate_path: "~/.config/rbac-audit/rbac-audit-collector.pem"
